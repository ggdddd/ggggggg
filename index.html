<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>灰燼</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#000;color:#fff;font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;}

  /* ===== 標題頁 ===== */
  #titleScreen{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:1000;cursor:pointer;}
  #titleScreen h1{font-size:110px;letter-spacing:48px;color:#fff;font-weight:200;margin-right:-48px;}
  #titleScreen .subtitle{color:#888;font-size:13px;letter-spacing:16px;margin-top:28px;}
  #titleScreen .start{color:#fff;font-size:13px;letter-spacing:8px;margin-top:100px;animation:blink 1.6s infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}

  /* ===== 主介面 ===== */
  #game{display:none;flex-direction:column;height:100vh;width:100vw;}
  #game.visible{display:flex;}

  #topArea{flex:1;display:flex;min-height:0;}

  #gameArea{flex:4;border-right:2px solid #fff;overflow:hidden;display:flex;justify-content:center;align-items:center;position:relative;background:#000;}

  #sidePanel{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;background:#000;}

  #sidePanel .label{color:#999;font-size:11px;letter-spacing:5px;border-bottom:1px solid #333;padding-bottom:5px;margin-top:6px;}
  #sidePanel .label:first-child{margin-top:0;}

  #sidePanel button{background:#000;color:#fff;border:1px solid #888;padding:10px 12px;font-family:inherit;font-size:13px;cursor:pointer;letter-spacing:3px;transition:0.15s;width:100%;}
  #sidePanel button:hover{border-color:#fff;background:#111;}

  .info-row{color:#fff;font-size:12px;line-height:1.8;}
  .info-row .k{color:#888;}

  #dialogBar{height:10vh;min-height:90px;max-height:130px;border-top:2px solid #fff;padding:12px 22px;overflow-y:auto;font-size:14px;line-height:1.8;color:#fff;white-space:pre-wrap;display:none;background:#000;}
  #dialogBar.visible{display:block;}

  /* ===== 地圖格子 ===== */
  .grid{display:grid;gap:2px;}
  .cell{width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;user-select:none;text-align:center;line-height:1.1;}
  .cell.wall{border:1px solid #1a1a1a;color:transparent;}
  .cell.floor{color:transparent;}
  .cell.object{border:1px solid #777;background:#050505;}
  .cell.door{border:2px solid #fff;background:#000;font-size:12px;font-weight:500;}
  .cell.locked{border:2px dashed #fff;background:#000;font-size:12px;}
  .cell.player{background:#fff;color:#000;font-weight:bold;font-size:16px;border:1px solid #fff;}

  /* ===== 背包 / 密碼 彈窗 ===== */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.94);display:none;justify-content:center;align-items:center;z-index:200;padding:20px;}
  .overlay.active{display:flex;}
  .panel{background:#000;border:1px solid #fff;padding:22px;max-width:620px;width:100%;max-height:85vh;overflow-y:auto;}
  .panel h3{color:#fff;font-size:13px;letter-spacing:8px;border-bottom:1px solid #333;padding-bottom:10px;margin-bottom:14px;font-weight:500;}
  .inv-item{border:1px solid #555;padding:10px 14px;margin-bottom:6px;cursor:pointer;font-size:13px;color:#fff;transition:0.15s;display:flex;justify-content:space-between;align-items:center;}
  .inv-item:hover{border-color:#fff;background:#0a0a0a;}
  .inv-item.frag{border-color:#666;}
  .inv-item .badge{font-size:10px;color:#777;}
  .inv-detail{margin-top:12px;padding:14px;border:1px solid #333;font-size:12.5px;line-height:1.85;min-height:80px;white-space:pre-wrap;color:#ddd;}
  .empty{color:#777;font-size:13px;font-style:italic;padding:20px 0;text-align:center;}
  .pw-hint{color:#ccc;font-size:13px;line-height:1.8;white-space:pre-wrap;margin-bottom:16px;padding:14px;border:1px solid #333;background:#050505;}
  #pwInput{width:100%;background:#000;border:1px solid #888;color:#fff;padding:12px;font-family:inherit;font-size:18px;letter-spacing:5px;text-align:center;outline:none;text-transform:uppercase;}
  #pwInput:focus{border-color:#fff;}
  .panel-buttons{margin-top:16px;display:flex;gap:10px;justify-content:flex-end;}
  .panel-buttons button{background:#000;color:#fff;border:1px solid #888;padding:8px 20px;font-family:inherit;font-size:13px;cursor:pointer;letter-spacing:2px;}
  .panel-buttons button:hover{border-color:#fff;background:#111;}

  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-track{background:#000;}
  ::-webkit-scrollbar-thumb{background:#444;}
  ::-webkit-scrollbar-thumb:hover{background:#888;}
</style>
</head>

<!-- 標題頁 -->
<div id="titleScreen">
  <h1>灰燼</h1>
  <div class="subtitle">A S H E S</div>
  <div class="start">按任意鍵開始</div>
</div>

<!-- 主介面 -->
<div id="game">
  <div id="topArea">
    <div id="gameArea"></div>
    <div id="sidePanel">
      <div class="label">功能</div>
      <button onclick="openInv()">背包　( I )</button>
      <button onclick="manualSave()">存檔</button>
      <button onclick="confirmReset()">重新開始</button>

      <div class="label">房間</div>
      <div class="info-row" id="infoRoom">—</div>

      <div class="label">狀態</div>
      <div class="info-row"><span class="k">記憶碎片：</span><span id="infoFrag">0 / 7</span></div>
      <div class="info-row"><span class="k">物品數：</span><span id="infoItems">0</span></div>

      <div class="label">操作</div>
      <div class="info-row" style="color:#999;font-size:11px;line-height:2;">
        WASD 移動<br>
        E 互動 / 關閉對話<br>
        Z 開門 / 密碼 / 關閉對話<br>
        I 背包
      </div>
    </div>
  </div>
  <div id="dialogBar"></div>
</div>

<!-- 背包 -->
<div class="overlay" id="invOverlay">
  <div class="panel" id="invPanel"></div>
</div>

<!-- 密碼 -->
<div class="overlay" id="pwOverlay">
  <div class="panel">
    <h3>輸 入 密 碼</h3>
    <div class="pw-hint" id="pwHint"></div>
    <input id="pwInput" type="text" maxlength="30" autocomplete="off" spellcheck="false">
    <div class="panel-buttons">
      <button onclick="closePw(false)">取消</button>
      <button onclick="closePw(true)">確認</button>
    </div>
  </div>
</div>

/* ================================================================
   遊戲狀態
   ================================================================ */
let state = {
  room:'living', x:12, y:6,
  inv:[],
  flags:{stairs:false, r2:false, r3:false, r4:false, r5:false, r6:false, r7:false},
};

const VW = 20, VH = 12;

/* ================================================================
   存檔
   ================================================================ */
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){} }
function load(){ try{ const r = localStorage.getItem(SAVE_KEY); if(!r) return null; const s = JSON.parse(r); return (s && s.room) ? s : null; }catch(e){ return null; } }
function wipe(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

/* ================================================================
   對話框（打字機）
   ================================================================ */
let typingTimer = null;
let typingText = '';
let typingIndex = 0;
let isDialogOpen = false;
let isTyping = false;

function showDialog(text){
  const bar = document.getElementById('dialogBar');
  bar.textContent = '';
  bar.classList.add('visible');
  bar.scrollTop = 0;
  isDialogOpen = true;
  isTyping = true;
  typingText = text;
  typingIndex = 0;
  if(typingTimer) clearInterval(typingTimer);
  typingTimer = setInterval(function(){
    if(typingIndex >= typingText.length){
      clearInterval(typingTimer);
      typingTimer = null;
      isTyping = false;
      return;
    }
    bar.textContent += typingText[typingIndex++];
    bar.scrollTop = bar.scrollHeight;
  }, 18);
}

function advanceDialog(){
  if(!isDialogOpen) return false;
  if(isTyping){
    // 跳過打字機
    if(typingTimer) clearInterval(typingTimer);
    typingTimer = null;
    document.getElementById('dialogBar').textContent = typingText;
    isTyping = false;
    return true;
  }
  closeDialog();
  return true;
}

function closeDialog(){
  if(typingTimer){ clearInterval(typingTimer); typingTimer = null; }
  document.getElementById('dialogBar').classList.remove('visible');
  isDialogOpen = false;
  isTyping = false;
}

/* ================================================================
   渲染
   ================================================================ */
function render(){
  const room = ROOMS[state.room];
  if(!room) return;
  const grid = room.grid;
  const rH = grid.length;
  const rW = grid[0].length;

  let cx = state.x - Math.floor(VW/2);
  let cy = state.y - Math.floor(VH/2);
  if(rW <= VW) cx = Math.floor((rW - VW)/2);
  else cx = Math.max(0, Math.min(rW - VW, cx));
  if(rH <= VH) cy = Math.floor((rH - VH)/2);
  else cy = Math.max(0, Math.min(rH - VH, cy));

  let html = '<div class="grid" style="grid-template-columns:repeat('+VW+',52px);">';
  for(let y = 0; y < VH; y++){
    for(let x = 0; x < VW; x++){
      const gx = cx + x, gy = cy + y;
      let cls = 'cell', text = '';
      if(gx < 0 || gx >= rW || gy < 0 || gy >= rH){
        cls += ' wall';
      } else if(gx === state.x && gy === state.y){
        cls += ' player';
        text = '我';
      } else {
        const ch = grid[gy][gx];
        text = tileName(state.room, ch);
        if(ch === '#') cls += ' wall';
        else if(ch === '.') cls += ' floor';
        else if(ch === 'G') cls += ' locked';
        else if('kswlu d1234567'.indexOf(ch) >= 0) cls += ' door';
        else cls += ' object';
      }
      html += '<div class="'+cls+'">'+text+'</div>';
    }
  }
  html += '</div>';
  document.getElementById('gameArea').innerHTML = html;
  document.getElementById('infoRoom').textContent = room.name;
  updateSideInfo();
}

function updateSideInfo(){
  const fc = fragCount();
  document.getElementById('infoFrag').textContent = fc + ' / 7';
  document.getElementById('infoItems').textContent = state.inv.filter(function(id){ return ITEMS[id] && ITEMS[id].t === 'item'; }).length;
}

/* ================================================================
   移動
   ================================================================ */
const WALKABLE = new Set(['.', 'k', 's', 'w', 'l', 'u', 'd', '1', '2', '3', '4', '5', '6', '7', 'G']);

function move(dx, dy){
  if(isDialogOpen) return;
  const grid = ROOMS[state.room].grid;
  const nx = state.x + dx, ny = state.y + dy;
  if(ny < 0 || ny >= grid.length) return;
  if(nx < 0 || nx >= grid[0].length) return;
  const ch = grid[ny][nx];
  if(!WALKABLE.has(ch)) return;
  state.x = nx;
  state.y = ny;
  render();
  save();
}

/* ================================================================
   互動 E
   ================================================================ */
function interact(){
  if(isDialogOpen){ advanceDialog(); return; }
  const room = state.room;
  const grid = ROOMS[room].grid;
  const targets = [
    [state.x, state.y],
    [state.x+1, state.y], [state.x-1, state.y],
    [state.x, state.y+1], [state.x, state.y-1],
  ];
  for(let i = 0; i < targets.length; i++){
    const x = targets[i][0], y = targets[i][1];
    if(y < 0 || y >= grid.length || x < 0 || x >= grid[0].length) continue;
    const ch = grid[y][x];
    if(ch === '#' || ch === '.') continue;
    if(ch === 'G' && room === 'stairs') continue; // 鐵門只用 Z
    if(WALKABLE.has(ch) && ch !== 'G') continue; // 門不算互動

    const key = room + ':' + ch;
    const data = INTERACT[key];
    if(!data) continue;

    if(data.item && !has(data.item)){
      add(data.item);
      showDialog(data.text + '\n\n（獲得「' + ITEMS[data.item].n + '」）');
      save();
      updateSideInfo();
      return;
    }
    if(data.frag && !has(data.frag)){
      add(data.frag);
      showDialog(data.text + '\n\n（獲得「' + ITEMS[data.frag].n + '」）');
      save();
      updateSideInfo();
      return;
    }
    if(data.item && has(data.item)){ showDialog('這裡已經空了。'); return; }
    if(data.frag && has(data.frag)){ showDialog('碎片已經被我取下了。'); return; }
    showDialog(data.text);
    return;
  }
  showDialog('這裡沒有什麼特別的。');
}

/* ================================================================
   Z 開門
   ================================================================ */
async function doorAction(){
  if(isDialogOpen){ advanceDialog(); return; }

  const room = state.room;
  const grid = ROOMS[room].grid;

  // 樓梯間鐵門
  if(room === 'stairs'){
    const targets = [
      [state.x, state.y],
      [state.x+1, state.y], [state.x-1, state.y],
      [state.x, state.y+1], [state.x, state.y-1],
    ];
    for(let i = 0; i < targets.length; i++){
      const x = targets[i][0], y = targets[i][1];
      if(y < 0 || y >= grid.length || x < 0 || x >= grid[0].length) continue;
      const c = grid[y][x];
      if(c === 'G'){
        if(state.flags.stairs){
          showDialog('鐵門已經打開了。\n樓梯通往黑暗的二樓。\n\n（走到樓梯按 Z 上樓）');
        } else {
          const val = await askPassword('鐵門上有一個四位數的密碼鎖。\n鎖的旁邊刻著一行小字：\n\n「四個數字，一個日期。」\n\n（線索散落在一樓各房間）');
          if(val === '0315'){
            state.flags.stairs = true;
            save();
            const g = ROOMS.stairs.grid;
            g[6] = g[6].substring(0, 7) + 'u' + g[6].substring(8);
            render();
            showDialog('喀。\n鎖開了。\n\n鐵門發出刺耳的聲音，往兩邊滑開。\n樓梯通往黑暗的二樓。\n\n（走到樓梯格按 Z 上樓）');
          } else if(val !== null){
            triggerBE1();
          }
        }
        return;
      }
      if(c === 'u'){
        goRoom('corridor', 19, 8);
        return;
      }
    }
  }

  // 一般門
  const ch = grid[state.y][state.x];
  if(!WALKABLE.has(ch)){
    showDialog('這裡不是門。');
    return;
  }
  const key = room + ':' + ch;
  const ex = EXITS[key];
  if(!ex){
    showDialog('這裡沒有門。');
    return;
  }

  // 走廊 → 房間
  if(ch >= '1' && ch <= '7' && room === 'corridor'){
    const num = parseInt(ch);
    if(state.flags['r' + num]){
      goRoom(ex.room, ex.x, ex.y);
      return;
    }
    const pw = DOOR_PW[num];
    const val = await askPassword(pw.hint);
    if(val === pw.a){
      state.flags['r' + num] = true;
      save();
      goRoom(ex.room, ex.x, ex.y);
    } else if(val !== null){
      showDialog('喀。\n鎖沒有反應。\n\n密碼不對。');
    }
    return;
  }

  // 上樓
  if(ch === 'u'){
    if(!state.flags.stairs){
      showDialog('鐵門還鎖著。');
      return;
    }
    goRoom(ex.room, ex.x, ex.y);
    return;
  }

  goRoom(ex.room, ex.x, ex.y);
}

function goRoom(room, x, y){
  state.room = room;
  state.x = x;
  state.y = y;
  closeDialog();
  render();
  save();
  const r = ROOMS[room];
  if(room === 'corridor'){
    showDialog('我走上二樓。\n長廊上有七扇門。\n第一扇門是開的。');
  } else if(room.indexOf('room') === 0){
    showDialog('我走進' + r.name + '。');
  } else {
    showDialog('我走進' + r.name + '。');
  }
}

/* ================================================================
   密碼彈窗
   ================================================================ */
let pwResolve = null;
function askPassword(hint){
  return new Promise(function(resolve){
    document.getElementById('pwHint').textContent = hint;
    document.getElementById('pwInput').value = '';
    document.getElementById('pwOverlay').classList.add('active');
    pwResolve = resolve;
    setTimeout(function(){ document.getElementById('pwInput').focus(); }, 50);
  });
}

function closePw(ok){
  const inp = document.getElementById('pwInput');
  const val = ok ? inp.value.trim().toUpperCase().replace(/\s+/g, '') : null;
  document.getElementById('pwOverlay').classList.remove('active');
  if(pwResolve){
    const f = pwResolve;
    pwResolve = null;
    f(val);
  }
}

document.getElementById('pwInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter') closePw(true);
  if(e.key === 'Escape') closePw(false);
});

/* ================================================================
   背包
   ================================================================ */
function openInv(){
  if(isDialogOpen) return;
  const panel = document.getElementById('invPanel');
  let html = '<h3>背　包</h3>';
  if(state.inv.length === 0){
    html += '<div class="empty">背包是空的。</div>';
  } else {
    const items = state.inv.filter(function(id){ return ITEMS[id] && ITEMS[id].t === 'item'; });
    const frags = state.inv.filter(function(id){ return ITEMS[id] && ITEMS[id].t === 'frag'; });
    if(items.length === 0 && frags.length === 0){
      html += '<div class="empty">背包是空的。</div>';
    } else {
      html += '<div id="invList">';
      items.forEach(function(id){
        html += '<div class="inv-item" data-id="' + id + '"><span>' + ITEMS[id].n + '</span><span class="badge">物品</span></div>';
      });
      frags.forEach(function(id){
        html += '<div class="inv-item frag" data-id="' + id + '"><span>★ ' + ITEMS[id].n + '</span><span class="badge">記憶</span></div>';
      });
      html += '</div>';
      html += '<div class="inv-detail" id="invDetail">點擊上方物品查看詳細內容。</div>';
    }
  }
  html += '<div class="panel-buttons"><button onclick="closeInv()">關閉</button></div>';
  panel.innerHTML = html;
  document.getElementById('invOverlay').classList.add('active');

  const list = document.getElementById('invList');
  if(list){
    list.querySelectorAll('.inv-item').forEach(function(el){
      el.onclick = function(){
        document.getElementById('invDetail').textContent = ITEMS[el.dataset.id].d;
      };
    });
  }
}

function closeInv(){
  document.getElementById('invOverlay').classList.remove('active');
}

/* ================================================================
   存檔
   ================================================================ */
function manualSave(){
  save();
  if(isDialogOpen) closeDialog();
  showDialog('已存檔。');
}

/* ================================================================
   BE-1
   ================================================================ */
function triggerBE1(){

  save();
  closeDialog();
  showDialog(
'我按下最後一個數字。\n\n鎖沒有反應。\n\n然後，我聽見了聲音。\n不是從外面傳來的。\n是從牆壁裡面。\n\n牆壁開始滲出黑色的煙。\n我想跑，但雙腳已經被地板吞了進去。\n\n「你不想出去。」\n一個聲音說。\n那是我自己的聲音。\n\n「你根本不想想起來。」\n\n煙霧向我擠壓過來。\n像一個巨大的肺。\n\n我張開嘴，卻吸不到空氣。\n眼前的一切開始變黑。\n\n最後，我看見了一點火光。\n\n　　—— ［ GAME OVER — 灰燼 ］\n\n按 R 重新開始。');

/* ================================================================
   結局
   ================================================================ */
function fragCount(){
  return ['f1','f2','f3','f4','f5','f6','f7'].filter(has).length;
}

function showEnding(){
  const fc = fragCount();
  let text;
  if(fc < 5){
    text = '門開了。\n\n白光。\n消毒水的味道。\n\n我睜開眼睛，看見白色的天花板。\n\n「你醒了。」護士說。\n「你被發現倒在路邊，什麼都不記得了嗎？」\n\n我點頭。\n\n她微笑：「沒關係，慢慢來。」\n\n……\n\n三年後。\n\n我在一個陌生的客廳裡醒來。\n沙發上有一張燒焦的照片。\n\n我把它撿起來。\n不知道為什麼，眼淚掉了下來。\n\n我不記得自己是誰。\n我不記得這裡是哪裡。\n\n我只知道一件事——\n門打不開。\n\n　　—— ［ GAME OVER — 循環 ］\n\n按 R 重新開始。';
  } else if(fc <= 6){
    text = '門開了。\n\n我走出去。\n\n外面的雨已經停了。\n\n我知道自己忘了很重要的事。\n但我不確定自己想不想知道。\n\n口袋裡有一張照片。\n照片裡是兩個人的背影。\n\n我看著它很久。\n然後我把它收進口袋裡。\n\n我深吸一口氣，往前走。\n\n也許有一天，我會想起來。\n也許不會。\n\n但至少，我走了出來。\n\n這就夠了。\n\n　　—— ［ NORMAL END — 逃離 ］\n\n按 R 重新開始。';
  } else {
    text = '門開了。\n\n我沒有立刻走出去。\n\n我回頭看。\n\n房子裡站著三個人。\n父親、母親、妹妹。\n\n他們看著我，沒有說話。\n\n父親的嘴唇動了動。\n我讀出他的唇語：\n\n　　「活下去。」\n\n我點頭。\n\n然後房子開始崩塌。\n陽光從裂縫裡照進來。\n\n我走出去。\n雨停了。\n\n天空很藍。\n我抬頭看著它，很久很久。\n\n我記得他們。\n我記得那一天。\n我記得我為什麼活下來。\n\n這一次，我不會再忘記了。\n\n　　—— ［ TRUE END — 銘記 ］\n\n按 R 重新開始。';
  }
  state.room = 'ending';
  save();
  closeDialog();
  showDialog(text);
}

function showStayEnding(){
  state.room = 'stay';
  save();
  closeDialog();
  showDialog('「我不走了。」我說。\n\n房子安靜了下來。\n\n父親走過來，牽起我的手。\n母親站在他身後，微笑著。\n妹妹躲在母親的裙子後面，探出頭來看我。\n\n「那我們回家吧。」父親說。\n\n門在我身後關上。\n沒有痛。\n沒有火。\n\n只有溫暖。\n\n　　我終於，回家了。\n\n　　—— ［ HIDDEN END — 留下 ］\n\n按 R 重新開始。');
}

function has(id){ return state.inv.indexOf(id) >= 0; }
function add(id){ if(!has(id)) state.inv.push(id); }

/* ================================================================
   鍵盤
   ================================================================ */
document.addEventListener('keydown', function(e){
  // 標題頁
  if(!document.getElementById('game').classList.contains('visible')){
    startGame();
    return;
  }
  // 彈窗打開時
  if(document.getElementById('pwOverlay').classList.contains('active')) return;
  if(document.getElementById('invOverlay').classList.contains('active')){
    if(e.key === 'Escape' || e.key === 'i' || e.key === 'I') closeInv();
    return;
  }

  const k = e.key.toLowerCase();

  // 對話中：E/Z 關閉或跳過
  if(isDialogOpen){
    if(k === 'e' || k === 'z' || k === 'escape'){
      advanceDialog();
      e.preventDefault();
      return;
    }
  }

  if(k === 'w' || k === 'arrowup'){ move(0,-1); e.preventDefault(); return; }
  if(k === 's' || k === 'arrowdown'){ move(0,1); e.preventDefault(); return; }
  if(k === 'a' || k === 'arrowleft'){ move(-1,0); e.preventDefault(); return; }
  if(k === 'd' || k === 'arrowright'){ move(1,0); e.preventDefault(); return; }
  if(k === 'e'){ interact(); return; }
  if(k === 'z'){
    if(checkRoom7Core()){
      const panel = document.getElementById('invPanel');
      panel.innerHTML =
        '<h3>記 憶 核 心</h3>' +
        '<div class="pw-hint">白光散去。\n一個聲音問我——\n\n「你要留下來，還是出去？」</div>' +
        '<div class="panel-buttons" style="justify-content:center;">' +
        '<button onclick="closeInv();showEnding();">我要出去</button>' +
        '<button onclick="closeInv();showStayEnding();">我留下來</button>' +
        '</div>';
      document.getElementById('invOverlay').classList.add('active');
      return;
    }
    doorAction();
    return;
  }
  if(k === 'i'){ openInv(); return; }
  if(k === 'r'){ confirmReset(); return; }
  if(k === 'escape'){
    if(isDialogOpen) closeDialog();
    return;
  }
});

function checkRoom7Core(){
  if(state.room !== 'room7') return false;
  const dx = Math.abs(state.x - 4);
  const dy = Math.abs(state.y - 7);
  return dx <= 1 && dy <= 1;
}

/* ================================================================
   重新開始
   ================================================================ */
function confirmReset(){
  const panel = document.getElementById('invPanel');
  panel.innerHTML =
    '<h3>重 新 開 始</h3>' +
    '<div class="pw-hint">確定要清除所有進度，重新開始遊戲嗎？</div>' +
    '<div class="panel-buttons">' +
    '<button onclick="closeInv()">取消</button>' +
    '<button onclick="wipe();location.reload();">確定</button>' +
    '</div>';
  document.getElementById('invOverlay').classList.add('active');
}

/* ================================================================
   開始遊戲
   ================================================================ */
function startGame(){
  document.getElementById('titleScreen').style.display = 'none';
  document.getElementById('game').classList.add('visible');

  const s = load();
  if(s) state = s;

  if(state.room === 'be1' || state.room === 'ending' || state.room === 'stay'){
    state = {room:'living', x:12, y:6, inv:[], flags:{stairs:false, r2:false, r3:false, r4:false, r5:false, r6:false, r7:false}};
    wipe();
  }

  if(state.flags.stairs){
    const g = ROOMS.stairs.grid;
    g[6] = g[6].substring(0, 7) + 'u' + g[6].substring(8);
  }

  render();

  if(!s){
    showDialog('我睜開眼睛。\n\n天花板是白色的，有一盞沒亮的吊燈。\n我坐起來，發現自己躺在沙發上。\n\n我不記得自己是誰。\n我不記得這裡是哪裡。\n\n我只知道一件事——\n門打不開。\n\n（WASD 移動，E 互動，Z 開門，I 背包）');
  }
}

document.getElementById('titleScreen').addEventListener('click', startGame);

   啟動

  // 標題頁等待點擊
});
