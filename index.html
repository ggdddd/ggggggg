<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>灰燼</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#000;color:#fff;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;overflow:hidden;}
  body{display:flex;justify-content:center;align-items:center;}
  #game{position:relative;display:flex;flex-direction:column;align-items:center;}
  #topbar{display:flex;justify-content:space-between;align-items:center;width:100%;padding:8px 4px;}
  #topbar h1{color:#cc6633;font-size:16px;letter-spacing:8px;font-weight:600;text-shadow:0 0 12px rgba(204,102,51,0.5);}
  #topbar .btns button{background:#000;color:#888;border:1px solid #333;padding:4px 10px;font-family:inherit;font-size:12px;border-radius:3px;cursor:pointer;margin-left:6px;transition:0.15s;}
  #topbar .btns button:hover{color:#cc6633;border-color:#cc6633;}
  #roomName{color:#cc6633;font-size:12px;letter-spacing:4px;padding:4px 0;}
  #viewport{position:relative;background:#000;border:1px solid #1a1a1e;padding:2px;}
  .grid{display:grid;gap:1px;}
  .cell{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:12px;border-radius:2px;user-select:none;transition:background 0.08s;}
  .cell.wall{background:#0a0a0c;color:#1a1a1e;}
  .cell.floor{background:#000;color:#1a1a1e;}
  .cell.object{background:#141210;color:#aa8855;border:1px solid #2a2418;}
  .cell.door{background:#0a1410;color:#44aa77;border:1px solid #142a1e;}
  .cell.locked{background:#140a0a;color:#cc4444;border:1px solid #2a1414;}
  .cell.player{background:#281410;color:#ff8844;font-weight:bold;font-size:15px;border:1px solid #502010;box-shadow:0 0 14px rgba(255,136,68,0.6);}
  #hintBox{position:absolute;background:#000;border:1px solid #cc6633;color:#ffcc99;padding:4px 10px;font-size:12px;border-radius:3px;pointer-events:none;white-space:nowrap;box-shadow:0 0 12px rgba(204,102,51,0.5);z-index:10;display:none;letter-spacing:2px;top:6px;left:6px;}
  #dialog{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#000;border:1px solid #333;border-radius:4px;padding:14px 20px;min-width:520px;max-width:760px;color:#e8e8e8;font-size:14px;line-height:1.8;white-space:pre-wrap;display:none;z-index:20;box-shadow:0 0 30px rgba(0,0,0,0.95);}
  #dialog.frag{color:#88aadd;border-color:#335588;}
  #dialog.item{color:#ccaa66;border-color:#554422;}
  #dialog .close{position:absolute;top:4px;right:8px;color:#555;cursor:pointer;font-size:11px;}
  #dialog .close:hover{color:#cc6633;}
  #statusbar{color:#333;font-size:11px;letter-spacing:2px;padding:6px 0;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;justify-content:center;align-items:center;z-index:100;}
  .modal-overlay.active{display:flex;}
  .modal{background:#08080a;border:1px solid #333;border-radius:6px;padding:22px;max-width:560px;width:92%;max-height:85vh;overflow-y:auto;box-shadow:0 0 60px rgba(0,0,0,0.95);}
  .modal h3{color:#cc6633;font-size:15px;letter-spacing:3px;margin-bottom:12px;font-weight:600;}
  .modal .hint{color:#999;font-size:13px;white-space:pre-wrap;line-height:1.8;margin-bottom:14px;background:#000;padding:12px 14px;border-radius:3px;border:1px solid #1a1a1e;}
  .modal input{width:100%;background:#000;border:1px solid #333;color:#fff;padding:12px;font-size:18px;letter-spacing:4px;text-align:center;border-radius:3px;font-family:inherit;text-transform:uppercase;outline:none;}
  .modal input:focus{border-color:#cc6633;}
  .modal-buttons{margin-top:14px;display:flex;gap:8px;justify-content:flex-end;}
  .modal-buttons button{background:#000;color:#ccc;border:1px solid #333;padding:8px 18px;font-family:inherit;font-size:13px;border-radius:3px;cursor:pointer;transition:0.15s;}
  .modal-buttons button:hover{border-color:#cc6633;color:#cc6633;}
  .inv-item{padding:10px 14px;background:#000;border:1px solid #1a1a1e;border-radius:3px;margin-bottom:5px;cursor:pointer;font-size:13px;color:#ccc;transition:0.15s;display:flex;justify-content:space-between;align-items:center;}
  .inv-item:hover{border-color:#cc6633;color:#ffcc99;}
  .inv-item.fragment{color:#88aadd;}
  .inv-item.fragment:hover{border-color:#88aadd;color:#bbddff;}
  .inv-item .badge{font-size:10px;color:#555;}
  .inv-detail{margin-top:10px;padding:12px;background:#000;border:1px solid #1a1a1e;border-radius:3px;font-size:12px;line-height:1.8;min-height:70px;white-space:pre-wrap;color:#b8b8b8;}
  .empty{color:#555;font-size:13px;font-style:italic;padding:16px 0;text-align:center;}
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:#222;border-radius:3px;}
</style>
</head>

/* -------- 遊戲狀態 -------- */
let state = {
  room:'living', x:12, y:6,
  inv:[],
  flags:{stairs:false, r2:false, r3:false, r4:false, r5:false, r6:false, r7:false},
};

/* -------- 視圖 -------- */
const VW = 22, VH = 14, CELL = 36;

/* ================================================================
   工具
   ================================================================ */
function has(id){return state.inv.includes(id);}
function add(id){if(!state.inv.includes(id))state.inv.push(id);}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch(e){}}
function load(){try{const r=localStorage.getItem(SAVE_KEY);if(!r)return null;const s=JSON.parse(r);return (s&&s.room)?s:null;}catch(e){return null;}}
function wipe(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}

let dialogTimer = null;
function showDialog(text,cls){
  const d = document.getElementById('dialog');
  const t = document.getElementById('dialogText');
  t.textContent = text;
  d.className = '';
  if(cls) d.classList.add(cls);
  d.style.display = 'block';
  if(dialogTimer) clearTimeout(dialogTimer);
  if(cls !== 'item' && cls !== 'frag' && cls !== 'stay'){
    dialogTimer = setTimeout(closeDialog, 7000);
  }
}
function closeDialog(){
  document.getElementById('dialog').style.display = 'none';
  if(dialogTimer){clearTimeout(dialogTimer);dialogTimer=null;}
}
function showHint(text){
  const hb = document.getElementById('hintBox');
  hb.textContent = text;
  hb.style.display = 'block';
}
function hideHint(){
  document.getElementById('hintBox').style.display = 'none';
}

/* ================================================================
   渲染
   ================================================================ */
function render(){
  const room = ROOMS[state.room];
  const grid = room.grid;
  const rH = grid.length;
  const rW = grid[0].length;

  let cx = state.x - Math.floor(VW/2);
  let cy = state.y - Math.floor(VH/2);
  if(rW <= VW) cx = Math.floor((rW - VW)/2);
  else cx = Math.max(0, Math.min(rW - VW, cx));
  if(rH <= VH) cy = Math.floor((rH - VH)/2);
  else cy = Math.max(0, Math.min(rH - VH, cy));

  let html = '<div class="grid" style="grid-template-columns:repeat('+VW+','+CELL+'px);">';
  for(let y=0;y<VH;y++){
    for(let x=0;x<VW;x++){
      const gx = cx+x, gy = cy+y;
      let cls = 'cell', text = '';
      if(gx<0||gx>=rW||gy<0||gy>=rH){
        cls += ' wall';
      } else if(gx===state.x && gy===state.y){
        cls += ' player';
        text = '我';
      } else {
        const ch = grid[gy][gx];
        text = TN[ch] || '??';
        if(ch === '#') cls += ' wall';
        else if(ch === '.') cls += ' floor';
        else if(ch === 'G') cls += ' locked';
        else if(WALK.has(ch)) cls += ' door';
        else cls += ' object';
      }
      html += '<div class="'+cls+'">'+text+'</div>';
    }
  }
  html += '</div>';
  document.getElementById('viewport').innerHTML = html + '<div id="hintBox" style="display:none;"></div>';
  document.getElementById('roomName').textContent = '— ' + room.name + ' —';
}

/* ================================================================
   移動
   ================================================================ */
function move(dx,dy){
  const grid = ROOMS[state.room].grid;
  const nx = state.x+dx, ny = state.y+dy;
  if(ny<0||ny>=grid.length) return;
  if(nx<0||nx>=grid[0].length) return;
  if(!WALK.has(grid[ny][nx])) return;
  state.x = nx; state.y = ny;
  render(); save();
  updateHint();
}

/* ================================================================
   懸浮提示
   ================================================================ */
function updateHint(){
  const room = state.room;
  const grid = ROOMS[room].grid;
  const targets = [
    [state.x,state.y],
    [state.x+1,state.y],[state.x-1,state.y],
    [state.x,state.y+1],[state.x,state.y-1],
  ];
  for(const [x,y] of targets){
    if(y<0||y>=grid.length||x<0||x>=grid[0].length) continue;
    const ch = grid[y][x];
    if(ch === '#' || ch === '.') continue;

    // 樓梯間鐵門：只用 Z
    if(room === 'stairs' && ch === 'G'){
      showHint('Z：輸入密碼');
      return;
    }
    if(room === 'stairs' && ch === 'u'){
      showHint('Z：上樓');
      return;
    }

    if(WALK.has(ch)){
      if(ch >= '1' && ch <= '7' && room === 'corridor'){
        showHint('Z：開門');
      } else if(ch === 'u' || ch === 'd'){
        showHint('Z：' + (ch==='u'?'上樓':'下樓'));
      } else {
        showHint('Z：開門');
      }
      return;
    }

    // 物件：判斷是「收集」還是「查看」
    const key = room + ':' + ch;
    const data = INTERACT[key];
    if(data && ((data.item && !has(data.item)) || (data.frag && !has(data.frag)))){
      showHint('E：收集');
    } else {
      showHint('E：查看');
    }
    return;
  }
  hideHint();
}

/* ================================================================
   互動 E
   ================================================================ */
function interact(){
  const room = state.room;
  const grid = ROOMS[room].grid;
  const targets = [
    [state.x,state.y],
    [state.x+1,state.y],[state.x-1,state.y],
    [state.x,state.y+1],[state.x,state.y-1],
  ];
  for(const [x,y] of targets){
    if(y<0||y>=grid.length||x<0||x>=grid[0].length) continue;
    const ch = grid[y][x];
    if(ch === '#' || ch === '.') continue;

    // 鐵門只用 Z 操作，E 跳過
    if(ch === 'G' && room === 'stairs') continue;
    // 樓梯格不用 E
    if((ch === 'u' || ch === 'd') && room === 'stairs') continue;

    const key = room + ':' + ch;
    const data = INTERACT[key];
    if(!data){
      showDialog('這裡沒有什麼特別的。');
      return;
    }

    if(data.once && data.item && has(data.item)){
      showDialog('這裡已經空了。');
      return;
    }
    if(data.once && data.frag && has(data.frag)){
      showDialog('碎片已經被我取下了。');
      return;
    }

    if(data.item && !has(data.item)){
      add(data.item);
      showDialog(data.text + '\n\n（獲得「'+ITEMS[data.item].n+'」）', 'item');
      save();
      return;
    }
    if(data.frag && !has(data.frag)){
      add(data.frag);
      showDialog(data.text + '\n\n（獲得「'+ITEMS[data.frag].n+'」）', 'frag');
      save();
      return;
    }
    showDialog(data.text);
    return;
  }
  showDialog('這裡沒有什麼特別的。');
}

/* ================================================================
   Z 開門 / 密碼
   ================================================================ */
function doorAction(){
  const room = state.room;
  const grid = ROOMS[room].grid;

  // --- 樓梯間：鐵門用相鄰格檢查（因為 G 不可通行）---
  if(room === 'stairs'){
    const targets = [
      [state.x,state.y],
      [state.x+1,state.y],[state.x-1,state.y],
      [state.x,state.y+1],[state.x,state.y-1],
    ];
    for(const [x,y] of targets){
      if(y<0||y>=grid.length||x<0||x>=grid[0].length) continue;
      const c = grid[y][x];

      if(c === 'G'){
        if(state.flags.stairs){
          goRoom('corridor', 18, 12);
        } else {
          askPassword(
            '鐵門上有一個四位數的密碼鎖。\n旁邊刻著一行小字：\n\n「四個數字，一個日期。」\n\n（線索散落在一樓各房間）',
            function(val){
              if(val === '0315'){
                state.flags.stairs = true;
                save();
                // 把 G 換成 u
                const g = ROOMS.stairs.grid;
                g[5] = g[5].substring(0,9) + 'u' + g[5].substring(10);
                render();
                closeDialog();
                showDialog('喀。\n鎖開了。\n\n鐵門發出刺耳的聲音，往兩邊滑開。\n樓梯通往黑暗的二樓。\n\n（走到樓梯格按 Z 上樓）', 'stay');
              } else {
                triggerBE1();
              }
            }
          );
        }
        return;
      }
      if(c === 'u'){
        goRoom('corridor', 18, 12);
        return;
      }
    }
  }

  // --- 一般門 ---
  const ch = grid[state.y][state.x];
  if(!WALK.has(ch)){
    showDialog('這裡不是門。');
    return;
  }

  const key = room + ':' + ch;
  const ex = EXITS[key];
  if(!ex){
    showDialog('這裡沒有門。');
    return;
  }

  // 走廊 → 房間（需要密碼）
  if(ch >= '1' && ch <= '7' && room === 'corridor'){
    const num = parseInt(ch);
    if(state.flags['r'+num]){
      goRoom(ex.room, ex.x, ex.y);
      return;
    }
    const pw = DOOR_PW[num];
    askPassword(
      '門上沒有鎖孔，只有一片平滑的金屬。\n旁邊刻著一行小字：\n\n「說出那句話，門就會開。」',
      function(val){
        if(val === pw.a){
          state.flags['r'+num] = true;
          save();
          closeDialog();
          showDialog('喀。\n鎖開了。\n\n第'+num+'扇門緩緩打開。');
          setTimeout(function(){goRoom(ex.room, ex.x, ex.y);}, 900);
        } else {
          closeDialog();
          showDialog('喀。\n鎖沒有反應。\n\n密碼不對。');
        }
      }
    );
    return;
  }

  // 上樓
  if(ch === 'u'){
    if(!state.flags.stairs){
      showDialog('鐵門還鎖著。');
      return;
    }
    goRoom(ex.room, ex.x, ex.y);
    return;
  }

  goRoom(ex.room, ex.x, ex.y);
}

function goRoom(room, x, y){
  state.room = room;
  state.x = x;
  state.y = y;
  closeDialog();
  render();
  save();
  const r = ROOMS[room];
  if(room === 'corridor'){
    showDialog('我走上二樓。\n長廊上有七扇門。\n第一扇門是開的。');
  } else if(room.startsWith('room')){
    showDialog('我走進' + r.name + '。');
  } else {
    showDialog('我走進' + r.name + '。');
  }
  updateHint();
}

/* ================================================================
   密碼輸入
   ================================================================ */
let pwCb = null;
function askPassword(hint, cb){
  pwCb = cb;
  const ov = document.getElementById('modalOverlay');
  const mc = document.getElementById('modalContent');
  mc.innerHTML =
    '<h3>輸入密碼</h3>' +
    '<div class="hint">'+hint+'</div>' +
    '<input id="pwInput" type="text" maxlength="24" autocomplete="off" spellcheck="false">' +
    '<div class="modal-buttons"><button id="pwCancel">取消</button><button id="pwSubmit">確認</button></div>';
  ov.classList.add('active');
  const inp = document.getElementById('pwInput');
  setTimeout(function(){inp.focus();},50);
  document.getElementById('pwSubmit').onclick = function(){
    const v = inp.value.trim().toUpperCase().replace(/\s+/g,'');
    closeModal();
    if(pwCb){const f=pwCb;pwCb=null;f(v);}
  };
  document.getElementById('pwCancel').onclick = function(){closeModal();pwCb=null;};
  inp.onkeydown = function(e){
    if(e.key==='Enter') document.getElementById('pwSubmit').click();
    if(e.key==='Escape') document.getElementById('pwCancel').click();
  };
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('active');
  document.getElementById('modalContent').innerHTML = '';
}

/* ================================================================
   背包
   ================================================================ */
function openInv(){
  const mc = document.getElementById('modalContent');
  const ov = document.getElementById('modalOverlay');
  let html = '<h3>背包</h3>';
  if(state.inv.length === 0){
    html += '<div class="empty">背包是空的。</div>';
  } else {
    html += '<div id="invList">';
    state.inv.forEach(function(id){
      const it = ITEMS[id];
      if(!it) return;
      const cls = it.t === 'frag' ? 'inv-item fragment' : 'inv-item';
      const pre = it.t === 'frag' ? '★ ' : '';
      const badge = it.t === 'frag' ? '記憶' : '物品';
      html += '<div class="'+cls+'" data-id="'+id+'"><span>'+pre+it.n+'</span><span class="badge">'+badge+'</span></div>';
    });
    html += '</div><div class="inv-detail" id="invDetail">點擊上方物品查看內容。</div>';
  }
  html += '<div class="modal-buttons"><button onclick="closeModal()">關閉</button></div>';
  mc.innerHTML = html;
  ov.classList.add('active');
  const list = document.getElementById('invList');
  if(list){
    list.querySelectorAll('.inv-item').forEach(function(el){
      el.onclick = function(){
        document.getElementById('invDetail').textContent = ITEMS[el.dataset.id].d;
      };
    });
  }
}

  } else {
    text =
'門開了。\n\n我沒有立刻走出去。\n\n我回頭看。\n\n房子裡站著三個人。\n父親、母親、妹妹。\n\n他們看著我，沒有說話。\n\n父親的嘴唇動了動。\n我讀出他的唇語：\n\n　　「活下去。」\n\n我點頭。\n\n然後房子開始崩塌。\n陽光從裂縫裡照進來。\n\n我走出去。\n雨停了。\n\n天空很藍。\n我抬頭看著它，很久很久。\n\n我記得他們。\n我記得那一天。\n我記得我為什麼活下來。\n\n這一次，我不會再忘記了。\n\n　　—— ［ TRUE END — 銘記 ］';
  }
  state.room = 'ending';
  save();
  closeDialog();
  showDialog(text, 'stay');
}

function showStayEnding(){
  state.room = 'stay';
  save();
  closeDialog();
  showDialog(
'「我不走了。」我說。\n\n房子安靜了下來。\n\n父親走過來，牽起我的手。\n母親站在他身後，微笑著。\n妹妹躲在母親的裙子後面，探出頭來看我。\n\n「那我們回家吧。」父親說。\n\n門在我身後關上。\n沒有痛。\n沒有火。\n\n只有溫暖。\n\n　　我終於，回家了。\n\n　　—— ［ HIDDEN END — 留下 ］', 'stay');
}

/* 第七間房書桌 → 記憶核心 */
function checkRoom7Core(){
  if(state.room !== 'room7') return false;
  const dx = Math.abs(state.x - 4);
  const dy = Math.abs(state.y - 10);
  return dx <= 1 && dy <= 1;
}

/* ================================================================
   鍵盤
   ================================================================ */
document.addEventListener('keydown', function(e){
  if(document.getElementById('modalOverlay').classList.contains('active')) return;

  const k = e.key.toLowerCase();
  if(k==='w'||k==='arrowup'){move(0,-1);e.preventDefault();return;}
  if(k==='s'||k==='arrowdown'){move(0,1);e.preventDefault();return;}
  if(k==='a'||k==='arrowleft'){move(-1,0);e.preventDefault();return;}
  if(k==='d'||k==='arrowright'){move(1,0);e.preventDefault();return;}
  if(k==='e'){interact();return;}
  if(k==='z'){
    // 房間 7 書桌 → 記憶核心
    if(checkRoom7Core()){
      const mc = document.getElementById('modalContent');
      const ov = document.getElementById('modalOverlay');
      mc.innerHTML =
        '<h3>記憶核心</h3>' +
        '<div class="hint">白光散去。\n一個聲音問我——\n\n「你要留下來，還是出去？」</div>' +
        '<div class="modal-buttons" style="justify-content:center;">' +
        '<button id="cOut">我要出去</button>' +
        '<button id="cStay">我留下來</button>' +
        '</div>';
      ov.classList.add('active');
      document.getElementById('cOut').onclick = function(){closeModal();showEnding();};
      document.getElementById('cStay').onclick = function(){closeModal();showStayEnding();};
      return;
    }
    doorAction();
    return;
  }
  if(k==='i'){openInv();return;}
  if(k==='r'){confirmReset();return;}
  if(k==='escape'){closeDialog();closeModal();return;}
});

/* ================================================================
   重新開始
   ================================================================ */
function confirmReset(){
  const mc = document.getElementById('modalContent');
  const ov = document.getElementById('modalOverlay');
  mc.innerHTML =
    '<h3>重新開始</h3>' +
    '<div class="hint">確定要清除所有進度，重新開始遊戲嗎？</div>' +
    '<div class="modal-buttons">' +
    '<button id="rCancel">取消</button>' +
    '<button id="rOk">確定</button>' +
    '</div>';
  ov.classList.add('active');
  document.getElementById('rCancel').onclick = closeModal;
  document.getElementById('rOk').onclick = function(){wipe();location.reload();};
}

/* ================================================================
   初始化
   ================================================================ */
function boot(){
  const s = load();
  if(s) state = s;

  if(state.room === 'be1' || state.room === 'ending' || state.room === 'stay'){
    state = {room:'living',x:12,y:6,inv:[],flags:{stairs:false,r2:false,r3:false,r4:false,r5:false,r6:false,r7:false}};
    wipe();
  }

  if(state.flags.stairs){
    const g = ROOMS.stairs.grid;
    g[5] = g[5].substring(0,9) + 'u' + g[5].substring(10);
  }

  render();
  updateHint();

  if(!s || s.room === 'living'){
    showDialog(
'我睜開眼睛。\n\n天花板是白色的，有一盞沒亮的吊燈。\n我坐起來，發現自己躺在沙發上。\n\n我不記得自己是誰。\n我不記得這裡是哪裡。\n\n我只知道一件事——\n門打不開。\n\n（WASD 移動，E 互動，Z 開門，I 背包）', 'stay');
  }
}

window.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
